<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Survivors — jeu de zombies sous Unity</title><desc id="d">Radar vu de dessus avec des zombies autour de deux joueurs, et un HUD : vague 7, santé, munitions 24/120, 2 joueurs connectés.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset=".55" stop-color="#03060c"/><stop offset="1" stop-color="#070514"/></linearGradient>
<radialGradient id="halo" cx=".72" cy=".45" r=".55"><stop stop-color="#22e5ff" stop-opacity=".22"/><stop offset="1" stop-color="#22e5ff" stop-opacity="0"/></radialGradient>
<radialGradient id="halo2" cx=".15" cy=".1" r=".5"><stop stop-color="#7a3dff" stop-opacity=".16"/><stop offset="1" stop-color="#7a3dff" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0d2a3d" stop-opacity="0"/><stop offset="1" stop-color="#22e5ff" stop-opacity=".55"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#22e5ff" stop-opacity=".16"/><stop offset="1" stop-color="#22e5ff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#22e5ff" opacity=".13"/></pattern>
<pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".28"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}
@media (prefers-reduced-motion:no-preference){
.scan{animation:scan 6s linear infinite}
.floor{animation:floor 2.4s linear infinite}
.blink{animation:blink 1.4s steps(2,start) infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.glitch1{animation:g1 5s steps(1) infinite}
.glitch2{animation:g2 5s steps(1) infinite}
.type{animation:type 1.2s steps(30) both}
.l1{animation:appear .3s .3s both}.l2{animation:appear .3s .6s both}.l3{animation:appear .3s .9s both}
.l4{animation:appear .3s 1.2s both}.l5{animation:appear .3s 1.5s both}.l6{animation:appear .3s 2s both}
.l7{animation:appear .3s 2.5s both}
.packet{animation:packet 3.2s ease-in-out infinite}
}
@keyframes scan{from{transform:translateY(-140px)}to{transform:translateY(620px)}}
@keyframes floor{from{transform:translateY(0)}to{transform:translateY(28px)}}
@keyframes blink{to{visibility:hidden}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes g1{0%,92%,100%{transform:translate(0,0);opacity:0}93%{transform:translate(-4px,1px);opacity:.85}95%{transform:translate(3px,-1px);opacity:.85}97%{opacity:0}}
@keyframes g2{0%,92%,100%{transform:translate(0,0);opacity:0}93%{transform:translate(4px,-1px);opacity:.85}96%{transform:translate(-2px,1px);opacity:.85}98%{opacity:0}}
@keyframes appear{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes packet{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
</style><style>
@media (prefers-reduced-motion:no-preference){
.sweep{animation:sweep 4.2s steps(7) infinite}
.spin2{animation:spin2 4s linear infinite}
.bar{animation:bar 1.4s ease-out both;transform-box:fill-box;transform-origin:left}
}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(182px)}}
@keyframes spin2{to{transform:rotate(-360deg)}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<rect width="1200" height="300" rx="14" fill="url(#bg)"/><rect width="1200" height="300" rx="14" fill="url(#dots)"/>
<rect x=".5" y=".5" width="1199" height="299" rx="14" fill="none" stroke="#ff3d64" stroke-opacity=".45"/>
<rect x="0" y="40" width="4" height="220" fill="#ff3d64" filter="url(#glow)"/>
<text x="48" y="62" fill="#ff3d64" font-size="14" letter-spacing="4">03 · UNITY · C# · MULTIJOUEUR</text>
<text x="48" y="112" fill="#dff8ff" font-size="40" font-weight="800" filter="url(#glow)">Survivors</text>
<text x="48" y="156" fill="#6b8a9a" font-size="16">Jeu de survie contre des vagues de zombies.</text>
<text x="48" y="182" fill="#6b8a9a" font-size="16">Ma part : joueur et armes, multijoueur,</text>
<text x="48" y="208" fill="#6b8a9a" font-size="16">menus, HUD et niveaux.</text>
<rect x="640" y="30" width="520" height="240" rx="8" fill="#07101c" stroke="#ff3d64" stroke-opacity=".45"/>
<circle cx="760" cy="150" r="92" fill="none" stroke="#3dff9a" stroke-opacity=".25"/>
<circle cx="760" cy="150" r="61" fill="none" stroke="#3dff9a" stroke-opacity=".25"/>
<circle cx="760" cy="150" r="30" fill="none" stroke="#3dff9a" stroke-opacity=".25"/>
<line x1="668" y1="150" x2="852" y2="150" stroke="#3dff9a" stroke-opacity=".2"/><line x1="760" y1="58" x2="760" y2="242" stroke="#3dff9a" stroke-opacity=".2"/>
<g class="spin2" style="transform-origin:760px 150px"><path d="M760,150 L852,150 A92,92 0 0 0 834.5,95.7 Z" fill="#3dff9a" fill-opacity=".18"/></g>
<circle cx="695.9" cy="169.9" r="4" fill="#ff3d64" filter="url(#glow)" class="pulse" style="animation-delay:0.0s"/>
<circle cx="815.7" cy="121" r="4" fill="#ff3d64" filter="url(#glow)" class="pulse" style="animation-delay:0.3s"/>
<circle cx="691.7" cy="146.7" r="4" fill="#ff3d64" filter="url(#glow)" class="pulse" style="animation-delay:0.6s"/>
<circle cx="786" cy="209.5" r="4" fill="#ff3d64" filter="url(#glow)" class="pulse" style="animation-delay:0.9s"/>
<circle cx="706.5" cy="93.4" r="4" fill="#ff3d64" filter="url(#glow)" class="pulse" style="animation-delay:1.2s"/>
<circle cx="806" cy="180.8" r="4" fill="#ff3d64" filter="url(#glow)" class="pulse" style="animation-delay:1.5s"/>
<circle cx="826.2" cy="192.4" r="4" fill="#ff3d64" filter="url(#glow)" class="pulse" style="animation-delay:1.8s"/>
<circle cx="744.8" cy="109.4" r="4" fill="#ff3d64" filter="url(#glow)" class="pulse" style="animation-delay:2.1s"/>
<circle cx="845.2" cy="140.2" r="4" fill="#ff3d64" filter="url(#glow)" class="pulse" style="animation-delay:2.4s"/>
<circle cx="760" cy="150" r="6" fill="#3dff9a" filter="url(#glow2)"/><circle cx="782" cy="164" r="5" fill="#22e5ff" filter="url(#glow)"/>
<text x="890" y="70" fill="#ff3d64" font-size="13" letter-spacing="3" font-weight="700">VAGUE 07</text>
<text x="890" y="104" fill="#6b8a9a" font-size="11" letter-spacing="2">SANTÉ</text><rect x="890" y="112" width="230" height="10" rx="5" fill="#1a2433"/><rect x="890" y="112" width="160" height="10" rx="5" fill="#3dff9a" filter="url(#glow)"/>
<text x="890" y="150" fill="#6b8a9a" font-size="11" letter-spacing="2">MUNITIONS</text><text x="1120" y="152" fill="#ffb84d" font-size="22" font-weight="800" text-anchor="end" filter="url(#glow)">24<tspan fill="#6b8a9a" font-size="14">/120</tspan></text>
<g class="l3"><rect x="890" y="176" width="230" height="28" rx="4" fill="#22e5ff" fill-opacity=".1" stroke="#22e5ff" stroke-opacity=".7"/><text x="902" y="195" fill="#22e5ff" font-size="12">● 2 joueurs connectés</text></g>
<text x="890" y="240" fill="#6b8a9a" font-size="11">Unity · C# · multijoueur</text>
<rect class="scan" x="0" y="0" width="1200" height="90" fill="url(#scan)"/>
<rect width="1200" height="300" rx="14" fill="url(#lines)" opacity=".3"/>
</svg>