<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" width="1120" height="450" role="img" aria-labelledby="title desc">
<title id="title">Nicolas Jaumotte — cybersécurité</title>
<desc id="desc">Une scène isométrique représente des événements d’authentification analysés sur trois plaques. Un signal vert marque l’alerte à examiner.</desc>
<defs>
  <linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#151b32"/><stop offset=".58" stop-color="#111525"/><stop offset="1" stop-color="#111e2a"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#324d69" stop-opacity=".87"/><stop offset="1" stop-color="#1c2a40" stop-opacity="0"/></radialGradient>
  <linearGradient id="base" x2="100%" y2="100%"><stop stop-color="#40536c"/><stop offset="1" stop-color="#25334f"/></linearGradient>
  <linearGradient id="glass" x2="100%" y2="100%"><stop stop-color="#233750"/><stop offset=".57" stop-color="#1e2946"/><stop offset="1" stop-color="#43596f"/></linearGradient>
  <linearGradient id="glassTop" x2="100%" y2="100%"><stop stop-color="#40506c"/><stop offset=".56" stop-color="#253650"/><stop offset="1" stop-color="#3c5364"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#deff8c" stop-opacity=".66"/><stop offset=".38" stop-color="#abf0a5" stop-opacity=".26"/><stop offset="1" stop-color="#abf0a5" stop-opacity="0"/></radialGradient>
  <linearGradient id="signal" x2="100%" y2="100%"><stop stop-color="#e5ffa1"/><stop offset="1" stop-color="#8addc3"/></linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8195b2" opacity=".2"/></pattern>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
  .signal-run { animation: relay 4.55s cubic-bezier(.28,.08,.38,1) 1 both; }
  .signal-trail { animation: draw 4.1s ease-out 1 both; }
  .signal-ring { transform-origin: 867px 128px; animation: confirm 4.55s ease-out 1 both; }
  .signal-words { animation: show 4.55s ease-out 1 both; }
}
@keyframes relay {
  0%   { offset-distance: 0%; opacity: 0; }
  10%  { opacity: 1; }
  84%  { opacity: 1; offset-distance: 100%; }
  100% { offset-distance: 100%; opacity: 0; }
}
@keyframes draw {
  0%, 8% { stroke-dashoffset: 100; opacity: 0; }
  19% { opacity: .96; }
  85% { stroke-dashoffset: 0; opacity: .9; }
  100% { stroke-dashoffset: 0; opacity: .47; }
}
@keyframes confirm {
  0%, 70% { opacity: 0; transform: scale(.55); }
  82% { opacity: .9; transform: scale(.85); }
  100% { opacity: 0; transform: scale(1.5); }
}
@keyframes show { 0%, 58% { opacity: .44; } 94%, 100% { opacity: 1; } }
</style>
