  <text x="400" y="177">Un accès réussi</text>
  <text x="756" y="177">Une enquête</text>
</g>
<g fill="#b7c7da" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="24">
  <text x="37" y="213">Même serveur et compte</text>
  <text x="400" y="213">Même adresse source</text>
  <text x="756" y="213">Connexion légitime ?</text>
</g>
</svg>
